[package]
name = "optimageeditor"
version = "0.1.0"
description = "Lightweight image viewer / editor"
authors = ["oputo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "optimageeditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"


# Windows only: WebView2 SharedBuffer (zero-copy file reads). Versions must match the ones used by tauri/wry.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

# Keep `tauri dev` representative for performance: optimize our own crate (image decoding hot loops) in dev builds too
[profile.dev.package.optimageeditor]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
