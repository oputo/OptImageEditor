[package]
name = "optimageeditor"
version = "0.2.2"
description = "Lightweight image viewer / editor"
authors = ["oputo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "optimageeditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
# ZIP-compressed layer channels (decoded when the document is rotated / flipped)
flate2 = "1"
# OpenEXR (all compressions incl. DWAA/DWAB for reading) and half floats for the GPU upload
exr = "1.74"
half = "2"
# clipboard image (fallback when the WebView refuses navigator.clipboard.write)
arboard = { version = "3", default-features = false, features = ["image-data"] }
# ComfyUI traffic from Rust (src/comfy.rs): plain HTTP and WebSocket only, no TLS
reqwest = { version = "0.13", default-features = false }
tokio-tungstenite = "0.30"
tokio = { version = "1", features = ["macros", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# TLS crypto provider for reqwest: the updater turns on reqwest's rustls (without a provider) for every user of
# reqwest in the build, so `run()` installs ring once at startup (ring is the provider the updater itself uses)
rustls = { version = "0.23", default-features = false, features = ["ring"] }


# Windows only: WebView2 SharedBuffer (zero-copy file reads). Versions must match the ones used by tauri/wry.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
winreg = "0.56"

# desktop only: a second launch hands its files to the running window; in-app update (src/update.rs)
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Keep `tauri dev` representative for performance: optimize our own crate (image decoding hot loops) in dev builds too
[profile.dev.package.optimageeditor]
opt-level = 3

# ...and the EXR decoder with its decompressors (unoptimized they are ~10x slower)
[profile.dev.package.exr]
opt-level = 3
[profile.dev.package.zune-inflate]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.lebe]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
