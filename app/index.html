<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OptImageEditor</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header id="toolbar">
      <button id="btn-open" title="開く (Ctrl+O)">開く</button>
      <input id="file-input" type="file" accept=".psd,.psb,.png,.jpg,.jpeg,.webp" hidden />
      <span class="sep"></span>
      <button id="btn-fit" title="全体表示 (Ctrl+0)">全体</button>
      <button id="btn-100" title="100% (Ctrl+1)">100%</button>
      <span id="zoom-label">-</span>
      <span class="sep"></span>
      <button id="btn-copy" title="計測結果をクリップボードへ">計測をコピー</button>
      <span id="file-label"></span>
    </header>
    <main id="stage">
      <canvas id="view"></canvas>
      <div id="drop-hint">PSD / PNG / JPG をドロップ、または「開く」</div>
      <div id="busy" hidden>読み込み中…</div>
      <pre id="stats" hidden></pre>
    </main>
  </body>
</html>
